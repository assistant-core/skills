name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skill follows the Agent Skills spec
        run: uvx --from skills-ref==0.1.1 agentskills validate skills/assistant-core
      - name: Plugin and marketplace load in Claude Code
        run: npx -y @anthropic-ai/claude-code@2.1.301 plugin validate . --strict
