name: Release

# Push a tag matching plugin.json's version, e.g. v1.0.0. The zip is what
# claude.ai and Claude Desktop users upload; docs link to
# releases/latest/download/assistant-core.zip.
on:
  push:
    tags: ["v*"]

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches plugin.json version
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version"
            exit 1
          fi
      - name: Package the skill
        # The zip's root must be the skill folder, named like the skill.
        run: cd skills && zip -r ../assistant-core.zip assistant-core
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assistant-core.zip --generate-notes
